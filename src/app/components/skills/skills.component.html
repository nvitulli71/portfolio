<div id="skills">
  <section class="p-3 p-lg-5 d-flex column">
    <div class="container nv-skills my-auto">
      <h1>skills</h1>

      <div class="technical-skills">
        <h4>Development</h4>
        <div class="skills-badges">
          @for (skill of skills; track skill.title) {
            <div class="skill-badge">
              <img [src]="skill.path" [alt]="skill.title" class="skill-icon" />
              &nbsp;
              {{ skill.title }}
            </div>
          }
        </div>
      </div>
      <div class="interpersonal-skills">
        <h4>Technical/Interpersonal</h4>
        <div class="skills-badges">
          @for (skill of interpersonalSkills; track skill.title) {
            <div class="skill-badge">
              <fa-icon [icon]="faTerminal"></fa-icon>
              &nbsp;
              {{ skill.title }}
            </div>
          }
        </div>
      </div>
    </div>
  </section>
</div>
